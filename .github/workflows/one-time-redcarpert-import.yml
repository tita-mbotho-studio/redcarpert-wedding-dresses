name: One-time Redcarpert source snapshot import
# This workflow copies tracked source files only and does not build or deploy.
# It is deleted after the snapshot has been imported and verified.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-redcarpert-import.yml
permissions:
  contents: write
jobs:
  import-snapshot:
    if: github.event.head_commit.message == 'chore: start one-time Redcarpert source import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout independent destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout exact source snapshot without inherited history
        uses: actions/checkout@v4
        with:
          repository: tita-mbotho-studio/redcarpert-wedding-dresses
          ref: d93f98ee8022642a51687820b2900e475dfc8446
          path: _import_source
          fetch-depth: 1
          persist-credentials: false
      - name: Copy and verify current client website source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _import_source rev-parse HEAD)" = "d93f98ee8022642a51687820b2900e475dfc8446"
          test -f _import_source/src/data/client-ball-gowns.json
          test -f _import_source/public/redcarpert/brand/redcarpert-logo.png
          # Keep the temporary import workflow unchanged during the action:
          # GITHUB_TOKEN cannot necessarily push modifications to workflows.
          # The two manual-only release workflows are added separately.
          rsync -a --exclude='/.git/' --exclude='/.github/workflows/' _import_source/ ./
          rm -rf _import_source
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names = [
            'client-mermaid-dresses.json',
            'client-ball-gowns.json',
            'client-ruffled-dresses.json',
            'client-modern-tradition-dresses.json',
            'client-two-in-one-dresses.json'
          ];
          const all=names.flatMap(name=>JSON.parse(fs.readFileSync('src/data/'+name,'utf8')));
          const photos=all.reduce((n,d)=>n+d.photos.length,0);
          if(all.length!==53 || photos!==225) throw new Error('Client inventory changed: '+all.length+' dresses; '+photos+' photos');
          if(!fs.existsSync('public/site-assets/9def3725208290c4ef.png')) throw new Error('Missing original high-resolution asset');
          console.log('Verified source snapshot:',all.length,'dresses and',photos,'photographs; original binary assets present.');
          NODE
      - name: Commit copied files to independent Git history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet && { echo 'No source changes to import'; exit 1; }
          git commit -m 'chore: import exact Redcarpert source snapshot (no inherited fork history)'
          git push origin HEAD:main
