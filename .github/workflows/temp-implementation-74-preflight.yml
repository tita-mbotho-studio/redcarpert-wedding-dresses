name: TEMP Implementation 74 original slug takeover preflight
# Verification only; never publishes or renames any repository.
on:
  push:
    branches:
      - implementation/74-restore-original-site-slug
    paths:
      - .github/workflows/temp-implementation-74-preflight.yml
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/implementation/74-restore-original-site-slug' &&
      github.event.head_commit.message == 'verify: original-slug takeover preflight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:dist
      - name: Check old Pages URL routes, real images, dress galleries, lookbook and WhatsApp
        shell: bash
        run: |
          npm run preview -- --port 4173 > /tmp/restore-original-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid"' EXIT
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:4173/redcarpert-wedding-dresses/ > /dev/null
          node scripts/browser-media-delivery.mjs
          node scripts/browser-catalogue-cards.mjs
          node scripts/browser-dress-gallery.mjs
          node scripts/browser-lookbook.mjs
          node scripts/browser-whatsapp.mjs
          node scripts/browser-interactions.mjs
